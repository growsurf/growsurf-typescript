# Kevin accepted it on 2026-11-18 until 2026-12-18; remove it by then or when a patch ships.
auditConfig:
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm
    - GHSA-fc5q-39xc-vjpf
